<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Location & Street View Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Split Screen Layout */
    .container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    @media (min-width: 768px) {
      .container {
        flex-direction: row;
      }
    }

    #map, #street-view {
      flex: 1;
      height: 50vh;
      width: 100%;
    }

    @media (min-width: 768px) {
      #map, #street-view {
        height: 100vh;
        width: 50%;
      }
    }

    /* Floating Status Control Panel */
    .status-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      font-size: 14px;
      max-width: 300px;
    }

    .status-panel button {
      margin-top: 8px;
      padding: 8px 12px;
      width: 100%;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .status-panel button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Floating UI Panel -->
  <div class="status-panel">
    <div id="status">Click button to enable GPS location...</div>
    <button onclick="startTracking()">Share My Live Location</button>
  </div>

  <!-- Dual View Containers -->
  <div class="container">
    <div id="map"></div>
    <div id="street-view"></div>
  </div>

  <script>
    let map, panorama, userMarker;
    let watchId = null;

    // Default fallback position (e.g., Ekwulobia / Aguata area)
    const defaultLocation = { lat: 6.0245, lng: 7.0818 };

    function initMap() {
      // 1. Initialize Map
      map = new google.maps.Map(document.getElementById("map"), {
        center: defaultLocation,
        zoom: 17,
        mapTypeId: "hybrid",
      });

      // 2. Initialize Street View
      panorama = new google.maps.StreetViewPanorama(
        document.getElementById("street-view"),
        {
          position: defaultLocation,
          pov: { heading: 165, pitch: 0 },
          zoom: 1,
        }
      );

      // Link Street View to Map
      map.setStreetView(panorama);

      // 3. User Marker (Representing live location)
      userMarker = new google.maps.Marker({
        position: defaultLocation,
        map: map,
        title: "Live Position",
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 10,
          fillColor: "#4285F4",
          fillOpacity: 1,
          strokeColor: "#FFFFFF",
          strokeWeight: 3,
        },
      });

      // Update Street View when user clicks anywhere on the Map
      map.addListener("click", (event) => {
        updateViews(event.latLng.lat(), event.latLng.lng());
      });
    }

    // 4. Track Real-Time Location when Location / GPS is switched ON
    function startTracking() {
      const statusText = document.getElementById("status");

      if (!navigator.geolocation) {
        statusText.innerText = "Geolocation is not supported by your browser.";
        return;
      }

      statusText.innerText = "Requesting GPS permissions...";

      // Continuously monitor user position in real-time
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          statusText.innerHTML = `🟢 <b>Live Tracking Active</b><br>Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;

          updateViews(lat, lng);
        },
        (error) => {
          switch (error.code) {
            case error.PERMISSION_DENIED:
              statusText.innerText = "❌ Location permission denied.";
              break;
            case error.POSITION_UNAVAILABLE:
              statusText.innerText = "❌ Location information unavailable.";
              break;
            case error.TIMEOUT:
              statusText.innerText = "❌ Location request timed out.";
              break;
            default:
              statusText.innerText = "❌ An unknown error occurred.";
          }
        },
        {
          enableHighAccuracy: true, // Uses GPS chip for best precision
          maximumAge: 0,
          timeout: 10000,
        }
      );
    }

    // Update map marker and Street View panorama location
    function updateViews(lat, lng) {
      const pos = { lat: lat, lng: lng };

      // Move Map & Marker
      map.setCenter(pos);
      userMarker.setPosition(pos);

      // Move Street View Panorama
      panorama.setPosition(pos);
    }
  </script>

  <!-- Replace YOUR_API_KEY with your official Google Maps API Key -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"
    async
    defer
  ></script>

</body>
</html>
